user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $request_uri $memex_form_action {
        default                  "'self'";
        ~^/oauth/authorize(\?|$) "'self' https: http://localhost:* http://127.0.0.1:* http://[::1]:*";
    }

    server {
        listen 8080;
        root /app/web;
        client_max_body_size 32m;

        include /etc/nginx/memex-headers.conf;

        location ~ ^/(api|mcp|oauth|\.well-known) {
            try_files $uri /index.php$is_args$args;
        }
        location ~ ^/index\.php(/|$) {
            internal;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
            fastcgi_param DOCUMENT_ROOT /app/backend/public;
            fastcgi_read_timeout 180s;
        }

        location ~* (?:\.(?:php\d?|phtml|asp|aspx|jsp|cgi|pl|sql|bak|old|swp|ini|log)$|(?:^|/)(?:\.env|\.git|\.svn|\.aws|\.ssh|\.htaccess|wp-|wordpress|xmlrpc|phpmyadmin|cgi-bin|vendor/)) {
            return 404;
        }

        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/memex-headers.conf;
            try_files $uri =404;
        }

        location ~ "^/(|login|[a-z2-9]{12}(/.*)?)$" {
            add_header Cache-Control "no-cache";
            include /etc/nginx/memex-headers.conf;
            try_files /index.html =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            include /etc/nginx/memex-headers.conf;
            try_files $uri =404;
        }
    }
}
